# The worker's own launcher inside the installed image - same jar, same runtime,
# a process of its own. jpackage reads this once, at build time, to write the
# launcher's cfg; nothing reads it at runtime.
#
# What makes the second process a worker is here rather than in
# application-worker.properties because a profile group activates its members
# after itself, so anything written there would follow into app-worker-combined
# and leave the combined process headless and without a schema.
#
# System properties rather than arguments, and that is not a style choice: a
# launcher's cfg arguments are REPLACED by whatever the command line carries, and
# the command line has to carry the parent pid. As arguments, the profile would
# vanish the moment the supervisor passed the pid, and the worker would start as a
# second application. Java options are never replaced.
#
# Only what the worker needs. --enable-native-access is not repeated: it exists
# for the folder watcher's calls into kernel32, and watching belongs to the
# application role.
#
# One line, space separated, and it has to be: this is read as a Java properties
# file, so a repeated key does not accumulate - it overwrites. Written as five
# lines, the launcher came out carrying only the last of them, which left the
# worker with no profile and no heap of its own.
java-options=-Xms${installer.worker.initial-heap} -Xmx${installer.worker.max-heap} -Dspring.profiles.active=worker -Dspring.main.web-application-type=none -Dspring.flyway.enabled=false

# Invisible as an application, ordinary as a process. The user has one way into
# the product - the application launcher - and the application starts this one.
# It still shows in Task Manager under its own name, which is where its CPU and
# memory should be read separately from the application's.
win-shortcut=false
win-menu=false