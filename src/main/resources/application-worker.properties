# What a worker needs that the application does not.
#
# Deliberately almost empty. The two settings a standalone worker also wants - no web
# server and no Flyway - are passed as arguments by whoever starts the process, not set
# here: a group activates its members after itself, so anything written here would also
# apply to app-worker-combined and would turn the combined process into a headless one
# with no schema. Where a role differs, the difference is a profile on a component.
#
# The claim loops back off a little harder than the default while sharing a machine with
# the screens; everything else about how a worker paces itself has a documented default.
nimbus-file-manager.worker.poll-seconds=5