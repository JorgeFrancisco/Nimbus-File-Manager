name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # The 4 @SpringBootTest integration tests use Testcontainers to start a throwaway
    # PostgreSQL per test class, so no `services:` Postgres is needed - the ubuntu-latest
    # runner ships with Docker, which Testcontainers drives.

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The catalog backup shells out to pg_dump/pg_restore, and a client refuses to
      # dump a server newer than itself. The tests run PostgreSQL 17 - the major the
      # product ships - while the runner comes with a 16 client.
      #
      # The versioned binaries go on the PATH rather than the ones in /usr/bin: those
      # are wrappers that choose a version, and the choice differs per command. One
      # that connects to a server can infer 17 from it; "pg_restore --list" only reads
      # a file, so it fell back to the default of 16 and could not read what 17 had
      # written. Removing the 16 packages instead left the wrapper pointing at a
      # version that no longer existed, and even "pg_dump --version" failed.
      - name: Install the PostgreSQL 17 client
        run: |
          KEY=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o "$KEY" https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=$KEY] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"

      - name: Show which client the tests will use
        run: |
          which pg_dump pg_restore
          pg_dump --version
          pg_restore --version

      - name: ./mvnw clean test
        run: |
          chmod +x mvnw
          ./mvnw -B clean test

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Upload surefire test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14